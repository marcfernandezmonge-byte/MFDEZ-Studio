<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <title>Vault - Collector's Club</title>
  <link rel="stylesheet" href="vault.css">
</head>
<body>
  <main class="vault-page" data-vault-ready="false">
    <section class="vault-viewer" aria-label="Collector's Club Vault">
      <button class="vault-click-zone vault-click-zone--prev" type="button" data-direction="prev" aria-label="Imagen anterior"></button>
      <button class="vault-click-zone vault-click-zone--next" type="button" data-direction="next" aria-label="Imagen siguiente"></button>

      <div class="vault-image-container" aria-live="polite">
        <img class="vault-image vault-image--front" id="vaultImageFront" alt="" decoding="async">
        <img class="vault-image vault-image--back" id="vaultImageBack" alt="" decoding="async" aria-hidden="true">
      </div>

      <div class="vault-overlay-ui" id="vaultOverlayUi">
        <div class="vault-meta">
          <span class="vault-meta__count" id="vaultMetaCount">00 / 00</span>
          <span class="vault-meta__title" id="vaultMetaTitle">Collector's Vault</span>
        </div>

        <div class="vault-actions" aria-label="Acciones de imagen">
          <button class="vault-action" type="button" data-action="download">Download</button>
          <button class="vault-action" type="button" data-action="info" aria-expanded="false">Info</button>
        </div>
      </div>
    </section>

    <button class="vault-tray-trigger" id="vaultTrayTrigger" type="button" aria-expanded="false" aria-controls="vaultTray">
      Coleccion (0)
    </button>

    <section class="vault-tray" id="vaultTray" aria-label="Coleccion" aria-hidden="true">
      <div class="vault-tray__label">Vault</div>
      <div
        class="vault-tray-track cc-vault-gallery"
        id="vaultGallery"
        data-access-tier="premium"
        data-image-role="vault-full"
        aria-live="polite"
      ></div>
    </section>

    <aside class="vault-info-panel" id="vaultInfoPanel" aria-label="Informacion de imagen" aria-hidden="true"></aside>

    <div class="vault-status" id="vaultStatus" role="status" aria-live="polite">
      <span>Checking access</span>
    </div>
  </main>

  <script src="../collectorsClub/collectorsClub.js"></script>
  <script src="vault.js"></script>
</body>
</html>
