<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — MFDEZ Studio</title>
  <link rel="stylesheet" href="registro.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Polish global de release (imagen, overflow, inputs) -->
  <link rel="stylesheet" href="../../styles/hardening.css" />
  <script src="../../styles/hardening.js" defer></script>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       SISTEMA DE FONDO — 6 CAPAS (idéntico al login)
       ─────────────────────────────────────────────────────────
       No modificar — sistema visual compartido con login.
  ═══════════════════════════════════════════════════════════ -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-mesh"></div>
    <div class="bg-conic"></div>
    <div class="orb orb--blue"></div>
    <div class="orb orb--purple"></div>
    <div class="orb orb--cyan"></div>
    <div class="orb orb--indigo"></div>
    <canvas id="bgParticles"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
  </div>

  <!-- ══════════════════════════════════════════════
       CONTENEDOR PRINCIPAL
  ══════════════════════════════════════════════ -->
  <main class="page-center">

    <!-- Halo radial detrás del panel -->
    <div class="panel-halo" aria-hidden="true"></div>

    <!--
      PANEL GLASS
      IDs actualizados para JS independiente.
      Estructura visual idéntica al login.
    -->
    <div class="glass-panel" id="registerPanel">

      <!-- Reflejo de luz que sigue el cursor -->
      <div class="panel-glare" id="panelGlare" aria-hidden="true"></div>

      <!-- ── ENCABEZADO ── -->
      <header class="panel-header" id="animLogo">
        <h1 class="panel-title">Crear una cuenta</h1>
        <p class="panel-subtitle">Regístrate para acceder a tu cuenta</p>
      </header>

      <!-- ── FORMULARIO DE REGISTRO ── -->
      <form class="register-form" id="registerForm" novalidate>

        <!-- Nombre completo -->
        <div class="field-group" id="fieldName">
          <label class="field-label" for="name">Nombre completo</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M2.5 13.5C2.5 11.015 5.015 9 8 9C10.985 9 13.5 11.015 13.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <input
              class="field-input"
              type="text"
              id="name"
              name="name"
              placeholder="Tu nombre completo"
              autocomplete="name"
              required
            />
          </div>
          <span class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Correo electrónico -->
        <div class="field-group" id="fieldEmail">
          <label class="field-label" for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M2 4C2 3.44772 2.44772 3 3 3H13C13.5523 3 14 3.44772 14 4V12C14 12.5523 13.5523 13 13 13H3C2.44772 13 2 12.5523 2 12V4Z" stroke="currentColor" stroke-width="1.3"/>
                <path d="M2 4.5L8 8.5L14 4.5" stroke="currentColor" stroke-width="1.3"/>
              </svg>
            </span>
            <input
              class="field-input"
              type="email"
              id="email"
              name="email"
              placeholder="tu@correo.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Contraseña -->
        <div class="field-group" id="fieldPassword">
          <label class="field-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M5 7V5.5C5 3.567 6.343 2 8 2C9.657 2 11 3.567 11 5.5V7" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
              </svg>
            </span>
            <input
              class="field-input"
              type="password"
              id="password"
              name="password"
              placeholder="Mín. 6 caracteres"
              autocomplete="new-password"
              required
            />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
              <svg class="eye-icon eye-icon--show" width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M8 3C4.5 3 1.5 8 1.5 8C1.5 8 4.5 13 8 13C11.5 13 14.5 8 14.5 8C14.5 8 11.5 3 8 3Z" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              <svg class="eye-icon eye-icon--hide" width="15" height="15" viewBox="0 0 16 16" fill="none" style="display:none">
                <path d="M2 2L14 14M8 3C4.5 3 1.5 8 1.5 8C1.5 8 3.08 10.5 5.5 12M10.5 11.5C12.5 10 14.5 8 14.5 8C14.5 8 11.5 3 8 3" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
              </svg>
            </button>
          </div>
          <!-- Barra de seguridad de la contraseña — nueva en registro -->
          <div class="strength-wrap" id="strengthWrap" aria-hidden="true">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <span class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Confirmar contraseña -->
        <div class="field-group" id="fieldConfirm">
          <label class="field-label" for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <!-- Icono shield-check — diferencia semántica del campo -->
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M8 2L3 4V8C3 11.314 5.239 13.5 8 14C10.761 13.5 13 11.314 13 8V4L8 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                <path d="M5.5 8L7 9.5L10.5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              class="field-input"
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              required
            />
            <button type="button" class="password-toggle" id="toggleConfirm" aria-label="Mostrar contraseña">
              <svg class="eye-icon eye-icon--show" width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M8 3C4.5 3 1.5 8 1.5 8C1.5 8 4.5 13 8 13C11.5 13 14.5 8 14.5 8C14.5 8 11.5 3 8 3Z" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              <svg class="eye-icon eye-icon--hide" width="15" height="15" viewBox="0 0 16 16" fill="none" style="display:none">
                <path d="M2 2L14 14M8 3C4.5 3 1.5 8 1.5 8C1.5 8 3.08 10.5 5.5 12M10.5 11.5C12.5 10 14.5 8 14.5 8C14.5 8 11.5 3 8 3" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Términos y condiciones -->
        <div class="terms-group" id="fieldTerms">
          <label class="terms-label">
            <input type="checkbox" id="terms" name="terms" class="terms-check" />
            <span class="terms-custom" aria-hidden="true"></span>
            <span class="terms-text">
              Acepto los <a href="#" class="link-accent">Términos y condiciones</a>
              y la <a href="#" class="link-accent">Política de privacidad</a>
            </span>
          </label>
          <span class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Botón principal -->
        <button type="submit" class="btn-login" id="submitBtn">
          <span class="btn-label">Crear cuenta</span>
          <span class="btn-spinner" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="9" r="7" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
              <path d="M9 2C5.134 2 2 5.134 2 9" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
        </button>

      </form>

      <!-- ── FOOTER ── -->
      <footer class="panel-footer">
        <p class="register-cta">
          ¿Ya tienes una cuenta?&nbsp;<a href="login.html" class="link-accent">Inicia sesión</a>
        </p>
      </footer>

    </div><!-- /glass-panel -->
  </main>

  <script src="registro.js"></script>
</body>
</html>
