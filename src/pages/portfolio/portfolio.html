  <link rel="stylesheet" href="mainPage.css" />

  <svg id="ag-loader-logo-fill" class="ag-loader__logo ag-loader__logo--fill" viewBox="0 0 647 301" version="1.1" xmlns="http://www.w3.org/2000/svg">
      <g>
          <path d="M420.749,0C376.097,0 340.032,36.494 340.032,81.147L340.032,300.543L393.271,300.543L393.271,162.722L586.907,162.722L586.907,109.054L393.701,109.054L393.701,81.147C393.701,66.119 406.152,53.668 421.179,53.668L640.575,53.668L640.575,0L420.749,0Z" />

      </g>
  </svg>
</div>
</div>

  <div class="ag-container" id="ag-container">
    <div class="ag-lateral-left" aria-hidden="true"></div>
    <div class="ag-lateral-right" aria-hidden="true"></div>

    <div class="ag-scene" id="ag-scene"></div>

    <div class="ag-indicator" id="ag-indicator"></div>

    <div class="ag-counter" aria-live="polite">
      <span class="ag-counter__current" id="ag-counter-current">01</span>
      <span class="ag-counter__sep">/</span>
      <span class="ag-counter__total" id="ag-counter-total">05</span>
    </div>

    <div class="ag-hint" id="ag-hint">
      <span>DESLIZA PARA ELEGIR</span>
      <svg width="14" height="20" viewBox="0 0 14 20" fill="none" aria-hidden="true">
        <path d="M7 0v16m0 0l-5-5m5 5l5-5"
              stroke="currentColor" stroke-width="1.2"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="ag-coin" aria-hidden="true">INSERTA MONEDA</div>

    <div class="ag-overlay" id="ag-overlay" role="dialog">
      <div class="ag-expanded" id="ag-expanded" onclick="event.stopPropagation()">
        <div class="ag-expanded__img-wrap">
          <img id="ag-expanded-img" src="" alt="" />
        </div>
        <div class="ag-expanded__info">
          <span class="ag-expanded__number" id="ag-expanded-number"></span>
          <h2 class="ag-expanded__title" id="ag-expanded-title"></h2>
          <p class="ag-expanded__hint">CLICK FUERA PARA CERRAR</p>
        </div>
      </div>
    </div>
  </div>

  <script src="portfolio.js"></script>
</body>
</html>
